name: Proposal
description: A change to behaviour, an interface, or the timing model.
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is difficult or impossible today. Not the solution yet.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations:
      required: true
  - type: textarea
    id: cost
    attributes:
      label: What it costs
      description: >-
        Every timing change trades something. If this affects the sweep, say what
        happens to recall on a network with a slow host on it — the unidentified
        device and the sleeping phone are the cases that matter.
    validations:
      required: true
