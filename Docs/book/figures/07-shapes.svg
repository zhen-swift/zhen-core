<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470">
  <rect x="4" y="4" width="792" height="462" rx="28" fill="#FFF8EE" stroke="#EADFCC" stroke-width="4"/>

  <!-- bound -->
  <rect x="24" y="24" width="368" height="422" rx="20" fill="#fff" stroke="#33335C" stroke-width="3"/>
  <text x="208" y="66" class="t b mid">bound</text>
  <text x="208" y="98" class="t s mid">one mailbox, many hosts</text>
  <use href="#mailbox" x="52" y="150" width="96" height="120"/>
  <g fill="none" stroke="#33335C" stroke-width="3" marker-end="url(#arrow)">
    <path d="M152 180 C 200 150, 220 140, 254 140"/>
    <path d="M152 200 H254"/>
    <path d="M152 220 C 200 250, 220 260, 254 260"/>
  </g>
  <use href="#device" x="264" y="108" width="72" height="63"/>
  <use href="#device" x="264" y="170" width="72" height="63"/>
  <use href="#device" x="264" y="232" width="72" height="63"/>
  <text x="208" y="334" class="m mid">en0 address : 52417</text>
  <text x="208" y="364" class="t s mid" opacity="0.75">(any free port)</text>
  <rect x="64" y="384" width="134" height="40" rx="20" fill="#B9A3F5" stroke="#33335C" stroke-width="2.5"/>
  <text x="131" y="411" class="t s mid">NetBIOS</text>
  <rect x="218" y="384" width="134" height="40" rx="20" fill="#B9A3F5" stroke="#33335C" stroke-width="2.5"/>
  <text x="285" y="411" class="t s mid">SSDP</text>

  <!-- connected -->
  <rect x="408" y="24" width="368" height="422" rx="20" fill="#fff" stroke="#33335C" stroke-width="3"/>
  <text x="592" y="66" class="t b mid">connected</text>
  <text x="592" y="98" class="t s mid">one mailbox, one peer</text>
  <use href="#mailbox" x="436" y="150" width="96" height="120"/>
  <path d="M536 200 H636" stroke="#33335C" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
  <path d="M636 222 H536" stroke="#33335C" stroke-width="3" marker-end="url(#arrow)" fill="none" stroke-dasharray="7 6"/>
  <use href="#device" x="648" y="170" width="96" height="84"/>
  <text x="592" y="334" class="m mid">→ 192.168.1.7 : 161</text>
  <text x="592" y="364" class="t s mid" opacity="0.75">ICMP errors come home</text>
  <rect x="502" y="384" width="180" height="40" rx="20" fill="#5DBE85" stroke="#33335C" stroke-width="2.5"/>
  <text x="592" y="411" class="t s mid" style="fill:#fff">UDP port scan</text>
