<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <rect x="4" y="4" width="792" height="472" rx="28" fill="#FFF8EE" stroke="#EADFCC" stroke-width="4"/>

  <text x="400" y="56" class="t b mid">Pip knocks on three ports of one host</text>

  <!-- the host's wall -->
  <rect x="30" y="80" width="740" height="206" rx="16" fill="#D9D3EC" stroke="#33335C" stroke-width="3"/>
  <path d="M60 110 h40 M300 104 h40 M560 112 h40 M250 250 h30 M520 246 h30" stroke="#A79FD0" stroke-width="3" stroke-linecap="round"/>

  <!-- port 22: open -->
  <text x="130" y="122" class="m mid">:22</text>
  <path d="M90 269 v-76 a40 40 0 0 1 80 0 v76 Z" fill="#33335C" stroke="#33335C" stroke-width="6" stroke-linejoin="round"/>
  <path d="M90 269 L64 258 L64 176 Q72 158 90 153 Z" fill="#C98A5E" stroke="#33335C" stroke-width="4" stroke-linejoin="round"/>
  <use href="#sparkle" x="116" y="196" width="28" height="28"/>
  <use href="#pip-yay" x="176" y="200" width="80" height="80"/>
  <rect x="176" y="126" width="84" height="44" rx="16" fill="#fff" stroke="#33335C" stroke-width="3"/>
  <text x="218" y="156" class="t s mid">hi!</text>

  <!-- port 23: closed -->
  <text x="385" y="122" class="m mid">:23</text>
  <use href="#door" x="335" y="136" width="100" height="140"/>
  <path d="M500 128 l8 18 l20 -6 l-10 16 l18 12 l-22 2 l2 20 l-16 -14 l-16 14 l2 -20 l-22 -2 l18 -12 l-10 -16 l20 6 Z" fill="#F26B6B" stroke="#33335C" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="502" y="104" class="t s mid" font-weight="700">RST!</text>
  <use href="#pip-worried" x="431" y="200" width="80" height="80"/>

  <!-- port 81: filtered -->
  <text x="640" y="122" class="m mid">:81</text>
  <use href="#door" x="590" y="136" width="100" height="140"/>
  <text x="730" y="160" class="t s mid" opacity="0.7">z z z</text>
  <use href="#pip" x="686" y="200" width="80" height="80"/>

  <!-- verdicts -->
  <use href="#check" x="62" y="304" width="36" height="36"/>
  <text x="106" y="332" class="t b">open</text>
  <text x="145" y="372" class="t s mid">it let us in</text>
  <text x="145" y="410" class="m mid">connected</text>

  <use href="#cross" x="318" y="304" width="36" height="36"/>
  <text x="362" y="332" class="t b">closed</text>
  <text x="400" y="372" class="t s mid">“nobody here”</text>
  <text x="400" y="410" class="m mid">ECONNREFUSED</text>

  <use href="#off" x="580" y="304" width="36" height="36"/>
  <text x="624" y="332" class="t b">filtered</text>
  <text x="655" y="372" class="t s mid">no answer</text>
  <text x="655" y="410" class="m mid">timeout</text>

  <text x="400" y="456" class="t s mid">Three answers. Zhen never squashes them into “not open”.</text>
</svg>
