<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <rect x="4" y="4" width="792" height="512" rx="28" fill="#FFF8EE" stroke="#EADFCC" stroke-width="4"/>

  <!-- the two verdicts -->
  <text x="40" y="70" class="t b">Each check says</text>
  <rect x="40" y="96" width="320" height="76" rx="18" fill="#fff" stroke="#33335C" stroke-width="3"/>
  <circle cx="80" cy="134" r="16" fill="#5DBE85" stroke="#33335C" stroke-width="3"/>
  <text x="110" y="143" class="t b">as assumed</text>
  <rect x="40" y="188" width="320" height="76" rx="18" fill="#fff" stroke="#33335C" stroke-width="3"/>
  <circle cx="80" cy="226" r="16" fill="#FFD45E" stroke="#33335C" stroke-width="3"/>
  <text x="110" y="235" class="t b">surprise!</text>
  <use href="#pip-yay" x="70" y="290" width="90" height="90"/>
  <use href="#pip-worried" x="200" y="290" width="90" height="90"/>
  <text x="200" y="430" class="t s mid">a surprise is the</text>
  <text x="200" y="458" class="t s mid">interesting one</text>

  <!-- the shared report: a paper slip -->
  <g transform="rotate(3 590 270)">
    <rect x="410" y="60" width="356" height="400" fill="#fff" stroke="#33335C" stroke-width="3"/>
    <rect x="550" y="48" width="76" height="24" fill="#B9A3F5" opacity="0.8"/>
    <text x="430" y="114" class="m">Zhen on iPhone</text>
    <path d="M430 132 H746" stroke="#A79FD0" stroke-width="2"/>
    <text x="430" y="172" class="m">- ok: ICMP …</text>
    <text x="430" y="212" class="m">- ok: Open-file …</text>
    <text x="430" y="252" class="m">- ok: Routing …</text>
    <text x="430" y="292" class="m" style="font-weight:700">- SURPRISE: …</text>
    <text x="430" y="332" class="m">- ok: …</text>
    <text x="430" y="372" class="m">- ok: …</text>
    <!-- share icon -->
    <rect x="686" y="392" width="44" height="44" rx="8" fill="none" stroke="#6FA8FF" stroke-width="4"/>
    <path d="M708 420 V376 M694 390 L708 376 L722 390" fill="none" stroke="#6FA8FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="590" y="496" class="t s mid">share it as plain text</text>
</svg>
