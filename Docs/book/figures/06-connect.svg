<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect x="4" y="4" width="792" height="592" rx="28" fill="#FFF8EE" stroke="#EADFCC" stroke-width="4"/>

  <text x="400" y="56" class="t b mid">One knock, in five steps</text>

  <path d="M56 120 V500" stroke="#A79FD0" stroke-width="4" stroke-dasharray="8 8"/>

  <!-- 1 -->
  <circle cx="56" cy="116" r="24" fill="#FFD45E" stroke="#33335C" stroke-width="3"/>
  <text x="56" y="125" class="t b mid">1</text>
  <text x="96" y="110" class="m">socket(AF_INET, SOCK_STREAM, …)</text>
  <text x="96" y="142" class="t s" opacity="0.8">get a ticket for a TCP mailbox</text>
  <g transform="rotate(-8 690 120)">
    <use href="#ticket" x="630" y="88" width="110" height="64"/>
    <text x="698" y="133" class="t h mid">7</text>
  </g>

  <!-- 2 -->
  <circle cx="56" cy="212" r="24" fill="#FFD45E" stroke="#33335C" stroke-width="3"/>
  <text x="56" y="221" class="t b mid">2</text>
  <text x="96" y="206" class="m">O_NONBLOCK + SO_LINGER {1,0}</text>
  <text x="96" y="238" class="t s" opacity="0.8">never wait; hang up rudely</text>
  <use href="#pip" x="650" y="166" width="80" height="80"/>

  <!-- 3 -->
  <circle cx="56" cy="308" r="24" fill="#FFD45E" stroke="#33335C" stroke-width="3"/>
  <text x="56" y="317" class="t b mid">3</text>
  <text x="96" y="302" class="m">connect(…) → -1, EINPROGRESS</text>
  <text x="96" y="334" class="t s" opacity="0.8">knock… and walk away at once</text>
  <use href="#door" x="650" y="262" width="56" height="78"/>
  <text x="742" y="270" class="t s mid" font-weight="700">knock!</text>

  <!-- 4 -->
  <circle cx="56" cy="404" r="24" fill="#FFD45E" stroke="#33335C" stroke-width="3"/>
  <text x="56" y="413" class="t b mid">4</text>
  <text x="96" y="398" class="m">wait until writable (kqueue)</text>
  <text x="96" y="430" class="t s" opacity="0.8">the door rings back… or the timer does</text>
  <g>
    <circle cx="692" cy="404" r="34" fill="#fff" stroke="#33335C" stroke-width="3.5"/>
    <path d="M692 404 V382 M692 404 L708 414" stroke="#33335C" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M664 374 l-10 -10 M720 374 l10 -10" stroke="#33335C" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- 5 -->
  <circle cx="56" cy="500" r="24" fill="#FFD45E" stroke="#33335C" stroke-width="3"/>
  <text x="56" y="509" class="t b mid">5</text>
  <text x="96" y="494" class="m">getsockopt(SO_ERROR)</text>
  <text x="96" y="526" class="t s" opacity="0.8">read the verdict</text>

  <use href="#check" x="440" y="474" width="34" height="34"/>
  <text x="480" y="500" class="m">0</text>
  <use href="#cross" x="512" y="474" width="34" height="34"/>
  <text x="552" y="500" class="m">REFUSED</text>
  <use href="#off" x="666" y="474" width="34" height="34"/>
  <text x="706" y="500" class="m">else</text>

  <text x="400" y="572" class="t s mid">Nothing ever sits and waits. The kernel calls back.</text>
</svg>
