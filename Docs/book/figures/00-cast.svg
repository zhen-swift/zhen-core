<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" width="800" height="570">
  <rect x="4" y="4" width="792" height="562" rx="28" fill="#FFF8EE" stroke="#EADFCC" stroke-width="4"/>

  <!-- row 1 -->
