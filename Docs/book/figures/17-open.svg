<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 720" width="800" height="720">
  <rect x="4" y="4" width="792" height="712" rx="28" fill="#FFF8EE" stroke="#EADFCC" stroke-width="4"/>

  <text x="400" y="62" class="t h mid">Still open</text>
  <text x="400" y="98" class="t s mid">nobody has looked on a real device yet</text>

  <!-- shelf 1 -->
  <rect x="30" y="300" width="740" height="16" rx="6" fill="#C98A5E" stroke="#33335C" stroke-width="3"/>
  <!-- shelf 2 -->
  <rect x="30" y="590" width="740" height="16" rx="6" fill="#C98A5E" stroke="#33335C" stroke-width="3"/>

  <!-- a jar: lid + body + ? -->
  <g id="jars">
    <!-- row 1: x centres 120, 300, 480, 660 -->
    <rect x="86" y="146" width="68" height="18" rx="6" fill="#B9A3F5" stroke="#33335C" stroke-width="3"/>
    <rect x="76" y="162" width="88" height="138" rx="18" fill="#BDEBD6" stroke="#33335C" stroke-width="3"/>
    <text x="120" y="252" class="t mid" style="font-size:56px;font-weight:800">?</text>

    <rect x="266" y="146" width="68" height="18" rx="6" fill="#B9A3F5" stroke="#33335C" stroke-width="3"/>
    <rect x="256" y="162" width="88" height="138" rx="18" fill="#BDEBD6" stroke="#33335C" stroke-width="3"/>
    <text x="300" y="252" class="t mid" style="font-size:56px;font-weight:800">?</text>

    <rect x="446" y="146" width="68" height="18" rx="6" fill="#B9A3F5" stroke="#33335C" stroke-width="3"/>
    <rect x="436" y="162" width="88" height="138" rx="18" fill="#BDEBD6" stroke="#33335C" stroke-width="3"/>
    <text x="480" y="252" class="t mid" style="font-size:56px;font-weight:800">?</text>

    <rect x="626" y="146" width="68" height="18" rx="6" fill="#B9A3F5" stroke="#33335C" stroke-width="3"/>
    <rect x="616" y="162" width="88" height="138" rx="18" fill="#BDEBD6" stroke="#33335C" stroke-width="3"/>
    <text x="660" y="252" class="t mid" style="font-size:56px;font-weight:800">?</text>

    <!-- row 2: x centres 150, 330, 510 -->
    <rect x="116" y="436" width="68" height="18" rx="6" fill="#B9A3F5" stroke="#33335C" stroke-width="3"/>
    <rect x="106" y="452" width="88" height="138" rx="18" fill="#FFD45E" stroke="#33335C" stroke-width="3"/>
    <text x="150" y="542" class="t mid" style="font-size:56px;font-weight:800">?</text>

    <rect x="296" y="436" width="68" height="18" rx="6" fill="#B9A3F5" stroke="#33335C" stroke-width="3"/>
    <rect x="286" y="452" width="88" height="138" rx="18" fill="#BDEBD6" stroke="#33335C" stroke-width="3"/>
    <text x="330" y="542" class="t mid" style="font-size:56px;font-weight:800">?</text>

    <rect x="476" y="436" width="68" height="18" rx="6" fill="#B9A3F5" stroke="#33335C" stroke-width="3"/>
    <rect x="466" y="452" width="88" height="138" rx="18" fill="#BDEBD6" stroke="#33335C" stroke-width="3"/>
    <text x="510" y="542" class="t mid" style="font-size:56px;font-weight:800">?</text>
  </g>

  <!-- labels under shelf 1 -->
  <text x="120" y="346" class="t s mid">route table</text>
  <text x="120" y="374" class="t s mid">readable?</text>
  <text x="300" y="346" class="t s mid">ARP dump</text>
  <text x="300" y="374" class="t s mid">empty?</text>
  <text x="480" y="346" class="t s mid">ticket limit</text>
  <text x="480" y="374" class="t s mid">how high?</text>
  <text x="660" y="346" class="t s mid">SSDP without</text>
  <text x="660" y="374" class="t s mid">entitlement?</text>

  <!-- labels under shelf 2 -->
  <text x="150" y="636" class="t s mid">permission</text>
  <text x="150" y="664" class="t s mid">denied?</text>
  <text x="330" y="636" class="t s mid">464 s naming,</text>
  <text x="330" y="664" class="t s mid">once</text>
  <text x="510" y="636" class="t s mid">on an</text>
  <text x="510" y="664" class="t s mid">iPhone?</text>

  <use href="#pip-worried" x="620" y="470" width="120" height="120"/>
