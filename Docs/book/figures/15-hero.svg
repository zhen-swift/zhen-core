<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect x="4" y="4" width="792" height="492" rx="28" fill="#FFF8EE" stroke="#EADFCC" stroke-width="4"/>

  <!-- Mac panel -->
  <rect x="24" y="24" width="370" height="400" rx="22" fill="#fff" stroke="#33335C" stroke-width="3"/>
  <text x="209" y="68" class="t h mid">Mac</text>
  <use href="#laptop" x="40" y="250" width="200" height="132"/>
  <use href="#crown" x="96" y="190" width="88" height="64"/>
  <use href="#periscope" x="262" y="150" width="70" height="120"/>
  <use href="#mailbox" x="246" y="280" width="80" height="100"/>
  <text x="140" y="146" class="t s mid">helper</text>
  <path d="M140 156 v28" stroke="#33335C" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="300" y="132" class="t s mid">BPF</text>
  <text x="290" y="406" class="t s mid">sockets</text>

  <!-- iPhone panel -->
  <rect x="406" y="24" width="370" height="400" rx="22" fill="#fff" stroke="#33335C" stroke-width="3"/>
  <text x="591" y="68" class="t h mid">iPhone</text>
