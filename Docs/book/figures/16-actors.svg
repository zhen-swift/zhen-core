<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640">
  <rect x="4" y="4" width="792" height="632" rx="28" fill="#FFF8EE" stroke="#EADFCC" stroke-width="4"/>

  <!-- the main actor floor -->
  <rect x="24" y="24" width="752" height="200" rx="22" fill="#BDEBD6" stroke="#33335C" stroke-width="3"/>
  <text x="44" y="66" class="t b">main actor</text>
  <text x="44" y="96" class="t s" opacity="0.8">the app target’s default</text>
  <use href="#phone" x="60" y="110" width="56" height="96"/>
  <rect x="140" y="130" width="230" height="56" rx="14" fill="#fff" stroke="#33335C" stroke-width="2.5"/>
  <text x="255" y="166" class="m mid">NetworkModel</text>
  <rect x="390" y="130" width="160" height="56" rx="14" fill="#fff" stroke="#33335C" stroke-width="2.5"/>
  <text x="470" y="166" class="m mid">watcher</text>
  <use href="#pip" x="620" y="60" width="130" height="130"/>

  <!-- the wall: a target boundary -->
  <rect x="24" y="230" width="752" height="56" fill="#D9D3EC" stroke="#33335C" stroke-width="3"/>
  <path d="M24 258 H776 M100 230 v28 M220 230 v28 M340 230 v28 M460 230 v28 M580 230 v28 M700 230 v28 M160 258 v28 M280 258 v28 M400 258 v28 M520 258 v28 M640 258 v28" stroke="#A79FD0" stroke-width="3"/>
  <rect x="556" y="238" width="200" height="40" rx="10" fill="#FFF8EE" stroke="#33335C" stroke-width="2.5"/>
  <text x="656" y="266" class="t s mid">target boundary</text>

  <!-- off the main actor -->
  <rect x="24" y="352" width="752" height="264" rx="22" fill="#fff" stroke="#33335C" stroke-width="3"/>
  <text x="44" y="398" class="t b">off the main actor</text>
  <rect x="44" y="416" width="300" height="52" rx="14" fill="#BDEBD6" stroke="#33335C" stroke-width="2.5"/>
  <text x="194" y="450" class="m mid">LiveScanRunner</text>
  <text x="360" y="450" class="t s">an actor</text>
  <rect x="44" y="482" width="300" height="52" rx="14" fill="#B9A3F5" stroke="#33335C" stroke-width="2.5"/>
  <text x="194" y="516" class="m mid">ScanRunner, engines</text>
  <text x="360" y="516" class="m">defaultIsolation(nil)</text>
  <rect x="44" y="548" width="300" height="52" rx="14" fill="#6FA8FF" stroke="#33335C" stroke-width="2.5"/>
  <text x="194" y="582" class="m mid">ICMPSocket</text>
  <text x="360" y="582" class="t s">its own queue</text>
  <use href="#mailbox" x="680" y="490" width="72" height="90"/>

  <!-- arrows across the wall -->
  <path d="M255 190 V346" stroke="#33335C" stroke-width="3.5" marker-end="url(#arrow)"/>
  <rect x="150" y="306" width="90" height="34" rx="8" fill="#FFF8EE"/>
  <text x="160" y="331" class="m">await</text>
  <path d="M470 350 V194" stroke="#33335C" stroke-width="3.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="486" y="331" class="t s">events</text>
</svg>
