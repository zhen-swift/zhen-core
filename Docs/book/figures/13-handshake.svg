<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <rect x="4" y="4" width="792" height="512" rx="28" fill="#FFF8EE" stroke="#EADFCC" stroke-width="4"/>
  <text x="400" y="54" class="t b mid">One knock, three answers</text>

  <!-- row open -->
  <use href="#pip" x="34" y="78" width="96" height="96"/>
  <path d="M140 110 H380" stroke="#33335C" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="260" y="98" class="m mid">SYN</text>
  <use href="#device" x="390" y="84" width="104" height="90"/>
  <path d="M380 150 H140" stroke="#5DBE85" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="260" y="182" class="m mid">SYN-ACK</text>
  <rect x="530" y="96" width="230" height="64" rx="16" fill="#5DBE85" stroke="#33335C" stroke-width="3"/>
  <text x="645" y="138" class="t b mid">open</text>

  <!-- row closed -->
  <use href="#pip" x="34" y="222" width="96" height="96"/>
  <path d="M140 254 H380" stroke="#33335C" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="260" y="242" class="m mid">SYN</text>
  <use href="#device" x="390" y="228" width="104" height="90"/>
  <path d="M380 294 H140" stroke="#F26B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="260" y="326" class="m mid">RST</text>
  <rect x="530" y="240" width="230" height="64" rx="16" fill="#F26B6B" stroke="#33335C" stroke-width="3"/>
  <text x="645" y="282" class="t b mid">closed</text>

  <!-- row filtered -->
  <use href="#pip-worried" x="34" y="366" width="96" height="96"/>
  <path d="M140 398 H380" stroke="#33335C" stroke-width="3.5" marker-end="url(#arrow)"/>
  <text x="260" y="386" class="m mid">SYN</text>
  <use href="#device" x="390" y="372" width="104" height="90"/>
  <text x="260" y="446" class="t b mid" opacity="0.6">· · · silence</text>
  <rect x="530" y="384" width="230" height="64" rx="16" fill="#D9D3EC" stroke="#33335C" stroke-width="3"/>
  <text x="645" y="426" class="t b mid">filtered</text>
  <text x="645" y="490" class="t s mid" opacity="0.8">“nothing came back in time”</text>
</svg>
