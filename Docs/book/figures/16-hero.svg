<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect x="4" y="4" width="792" height="492" rx="28" fill="#FFF8EE" stroke="#EADFCC" stroke-width="4"/>

  <!-- the phone with a big Scan button -->
  <use href="#phone" x="50" y="40" width="160" height="276"/>
  <rect x="80" y="150" width="100" height="50" rx="25" fill="#6FA8FF" stroke="#33335C" stroke-width="3"/>
  <text x="130" y="184" class="t b mid" style="fill:#fff">Scan</text>
  <text x="130" y="350" class="t b mid">tap</text>

  <!-- the slide -->
  <path d="M200 176 C 380 176, 330 420, 560 400" fill="none" stroke="#FFD45E" stroke-width="26" stroke-linecap="round"/>
  <path d="M200 176 C 380 176, 330 420, 560 400" fill="none" stroke="#33335C" stroke-width="3" stroke-dasharray="2 18" stroke-linecap="round"/>
  <!-- Pip on the slide -->
  <use href="#pip-yay" x="270" y="180" width="110" height="110"/>
  <use href="#sparkle" x="382" y="170" width="22" height="22"/>
  <use href="#sparkle" x="250" y="150" width="16" height="16"/>

  <!-- the castle -->
  <use href="#castle" x="530" y="200" width="250" height="212"/>
  <text x="655" y="190" class="t b mid">the kernel</text>
  <rect x="530" y="430" width="250" height="40" rx="12" fill="#fff" stroke="#33335C" stroke-width="2.5"/>
  <text x="655" y="458" class="m mid">socket(…ICMP)</text>

  <text x="280" y="458" class="t b mid">twelve steps down</text>
