<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470">
  <rect x="4" y="4" width="792" height="462" rx="28" fill="#FFF8EE" stroke="#EADFCC" stroke-width="4"/>

  <text x="40" y="58" class="t b">port 80 = <tspan class="m" style="font-size:26px">0x0050</tspan></text>

  <!-- in the chip -->
  <text x="40" y="116" class="t s">in the chip (little end first)</text>
  <rect x="40" y="130" width="90" height="70" rx="8" fill="#FFD45E" stroke="#33335C" stroke-width="3"/>
  <rect x="130" y="130" width="90" height="70" rx="8" fill="#FFD45E" stroke="#33335C" stroke-width="3"/>
  <text x="85" y="176" class="m mid" style="font-size:28px">50</text>
  <text x="175" y="176" class="m mid" style="font-size:28px">00</text>

  <!-- the flip -->
  <path d="M130 206 V276" stroke="#33335C" stroke-width="3.5" marker-end="url(#arrow)"/>
  <rect x="150" y="222" width="190" height="40" rx="10" fill="#fff" stroke="#33335C" stroke-width="2.5"/>
  <text x="245" y="250" class="m mid">.bigEndian</text>

  <!-- on the wire -->
  <text x="40" y="314" class="t s">on the wire (big end first)</text>
  <rect x="40" y="328" width="90" height="70" rx="8" fill="#6FA8FF" stroke="#33335C" stroke-width="3"/>
  <rect x="130" y="328" width="90" height="70" rx="8" fill="#6FA8FF" stroke="#33335C" stroke-width="3"/>
  <text x="85" y="374" class="m mid" style="font-size:28px">00</text>
  <text x="175" y="374" class="m mid" style="font-size:28px">50</text>
  <use href="#check" x="234" y="343" width="40" height="40"/>

  <!-- forgetting it -->
  <rect x="420" y="80" width="350" height="150" rx="22" fill="#fff" stroke="#33335C" stroke-width="3"/>
  <path d="M640 230 L660 262 L676 230" fill="#fff" stroke="#33335C" stroke-width="3" stroke-linejoin="round"/>
  <path d="M642 228 L674 228" stroke="#fff" stroke-width="5"/>
  <text x="595" y="124" class="t b mid">Forgot the flip?</text>
  <text x="595" y="162" class="t s mid">the wire reads <tspan class="m">50 00</tspan></text>
  <text x="595" y="200" class="t s mid">= port 20480!</text>
  <use href="#pip-worried" x="600" y="270" width="140" height="140"/>

  <text x="40" y="440" class="t s" opacity="0.7">Mac and iPhone chips are little-endian</text>
</svg>
