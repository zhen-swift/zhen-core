<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470">
  <rect x="4" y="4" width="792" height="462" rx="28" fill="#FFF8EE" stroke="#EADFCC" stroke-width="4"/>

  <text x="400" y="54" class="t b mid"><tspan class="m" style="font-size:26px">sockaddr_in</tspan>: 16 bytes</text>

  <!-- BSD-only sticker -->
  <g transform="rotate(-2 220 100)">
    <rect x="34" y="76" width="370" height="50" rx="8" fill="#FFB38A" stroke="#33335C" stroke-width="3"/>
    <text x="219" y="109" class="t s mid">BSD only: no sin_len on Linux</text>
  </g>
  <path d="M70 130 V150" stroke="#33335C" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- labels above -->
  <text x="180" y="176" class="m mid">sin_port</text>
  <text x="576" y="176" class="m mid">sin_zero</text>
  <path d="M70 184 V202 M180 184 V202 M576 184 V202" stroke="#33335C" stroke-width="2.5"/>

  <!-- the 16 bytes -->
  <g stroke="#33335C" stroke-width="3">
    <rect x="48" y="204" width="44" height="64" fill="#FFB38A"/>
    <rect x="92" y="204" width="44" height="64" fill="#FFD45E"/>
    <rect x="136" y="204" width="88" height="64" fill="#6FA8FF"/>
    <rect x="224" y="204" width="176" height="64" fill="#BDEBD6"/>
    <rect x="400" y="204" width="352" height="64" fill="#D9D3EC"/>
  </g>
  <path d="M180 204 v64 M268 204 v64 M312 204 v64 M356 204 v64" stroke="#33335C" stroke-width="1.5" opacity="0.5"/>
  <g class="m" text-anchor="middle">
    <text x="70" y="244" class="m mid">10</text>
    <text x="114" y="244" class="m mid">02</text>
    <text x="158" y="244" class="m mid">00</text>
    <text x="202" y="244" class="m mid">50</text>
    <text x="246" y="244" class="m mid">C0</text>
    <text x="290" y="244" class="m mid">A8</text>
    <text x="334" y="244" class="m mid">01</text>
    <text x="378" y="244" class="m mid">14</text>
    <text x="576" y="244" class="m mid">00 … 00</text>
  </g>

  <!-- labels below -->
  <path d="M114 270 V292 M312 270 V292" stroke="#33335C" stroke-width="2.5"/>
  <text x="70" y="176" class="m mid">sin_len</text>
  <text x="114" y="318" class="m mid">sin_family</text>
  <text x="312" y="318" class="m mid">sin_addr</text>

  <!-- what the values say -->
  <text x="48" y="376" class="t s">in hex: <tspan class="m">10</tspan> = 16 bytes · <tspan class="m">02</tspan> = AF_INET</text>
  <text x="48" y="412" class="t s"><tspan class="m">00 50</tspan> = port 80 · <tspan class="m">C0 A8 01 14</tspan> = 192.168.1.20</text>
  <text x="48" y="448" class="t s" opacity="0.7">port and address go big end first; the rest is zeros</text>
</svg>
