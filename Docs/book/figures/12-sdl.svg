    <rect x="350" y="310" width="36" height="44" fill="#B9A3F5"/>
    <rect x="386" y="310" width="36" height="44" fill="#B9A3F5"/>
    <rect x="422" y="310" width="36" height="44" fill="#B9A3F5"/>
    <rect x="458" y="310" width="36" height="44" fill="#B9A3F5"/>
    <rect x="494" y="310" width="36" height="44" fill="#FFB38A"/>
