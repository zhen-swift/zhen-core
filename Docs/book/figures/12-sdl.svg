  <text x="288" y="463" class="t s">MAC (alen = 6)</text>
  <rect x="490" y="440" width="28" height="28" fill="#D9D3EC" stroke="#33335C" stroke-width="3"/>
  <text x="528" y="463" class="t s">8 fixed bytes</text>
  <text x="400" y="500" class="t s mid" opacity="0.8">MAC starts at data + nlen. The “12” is a lie.</text>
