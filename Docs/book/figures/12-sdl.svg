  <g class="m mid"><text x="188" y="340">b</text><text x="224" y="340">r</text><text x="260" y="340">i</text><text x="296" y="340">d</text><text x="332" y="340">g</text><text x="368" y="340">e</text><text x="404" y="340">1</text><text x="440" y="340">0</text><text x="476" y="340">0</text></g>
  <text x="660" y="390" class="t s mid">past the</text>
  <text x="660" y="414" class="t s mid">“end”!</text>
  <text x="386" y="390" class="t s mid">9 + 6 = 15</text>

  <!-- legend -->
  <rect x="40" y="440" width="28" height="28" fill="#B9A3F5" stroke="#33335C" stroke-width="3"/>
  <text x="78" y="463" class="t s">name (nlen)</text>
