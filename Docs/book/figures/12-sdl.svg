  <text x="386" y="214" class="t s mid">MAC fits: 3 + 6 = 9</text>
  <use href="#check" x="512" y="140" width="40" height="40"/>

  <!-- row 2: bridge100 -->
  <text x="40" y="298" class="m">bridge100</text>
  <g>
    <rect x="100" y="310" width="64" height="44" rx="6" fill="#D9D3EC" stroke="#33335C" stroke-width="3"/>
  </g>
  <text x="132" y="340" class="t s mid">8</text>
  <g stroke="#33335C" stroke-width="3">
    <rect x="170" y="310" width="36" height="44" fill="#B9A3F5"/>
    <rect x="206" y="310" width="36" height="44" fill="#B9A3F5"/>
    <rect x="242" y="310" width="36" height="44" fill="#B9A3F5"/>
    <rect x="278" y="310" width="36" height="44" fill="#B9A3F5"/>
