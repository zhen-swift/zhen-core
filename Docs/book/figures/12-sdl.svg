  <!-- row 1: en0 -->
  <text x="40" y="168" class="m">en0</text>
  <g>
    <rect x="100" y="138" width="64" height="44" rx="6" fill="#D9D3EC" stroke="#33335C" stroke-width="3"/>
  </g>
  <text x="132" y="168" class="t s mid">8</text>
  <g stroke="#33335C" stroke-width="3">
    <rect x="170" y="138" width="36" height="44" fill="#B9A3F5"/>
    <rect x="206" y="138" width="36" height="44" fill="#B9A3F5"/>
