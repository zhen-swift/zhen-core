  <use href="#lock" x="64" y="490" width="50" height="62"/>
  <text x="130" y="530" class="t s">none to read</text>

  <path d="M380 506 H430" stroke="#33335C" stroke-width="3.5" marker-end="url(#arrow)"/>
  <rect x="440" y="436" width="320" height="140" rx="14" fill="#fff" stroke="#33335C" stroke-width="3"/>
  <text x="600" y="476" class="t s mid" font-weight="700">Nothing answered</text>
