<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1210" width="800" height="1210">
  <rect x="4" y="4" width="792" height="1202" rx="28" fill="#FFF8EE" stroke="#EADFCC" stroke-width="4"/>

  <!-- column heads -->
  <use href="#laptop" x="540" y="30" width="110" height="72"/>
  <text x="595" y="134" class="t b mid">Mac</text>
  <use href="#phone" x="696" y="22" width="48" height="84"/>
  <text x="720" y="134" class="t b mid">iPhone</text>
  <text x="40" y="76" class="t h">What runs where</text>
  <text x="40" y="112" class="t s" opacity="0.75">zhen-core 0.9.0</text>

  <!-- rows: 12 × 82, starting at y=152 -->
  <g>
    <rect x="24" y="152" width="752" height="78" rx="14" fill="#fff"/>
    <text x="40" y="186" class="t b">ICMP ping sweep</text>
    <text x="40" y="216" class="t s" opacity="0.75">no root needed</text>
    <use href="#check" x="573" y="169" width="44" height="44"/>
    <use href="#check" x="698" y="169" width="44" height="44"/>

    <text x="40" y="268" class="t b">TCP connect · banners · TLS</text>
    <text x="40" y="298" class="t s" opacity="0.75">BSD sockets + Network.framework</text>
    <use href="#check" x="573" y="251" width="44" height="44"/>
    <use href="#check" x="698" y="251" width="44" height="44"/>

    <rect x="24" y="316" width="752" height="78" rx="14" fill="#fff"/>
    <text x="40" y="350" class="t b">UDP ports</text>
    <text x="40" y="380" class="t s" opacity="0.75">for services Zhen has a probe for</text>
    <use href="#check" x="573" y="333" width="44" height="44"/>
    <use href="#check" x="698" y="333" width="44" height="44"/>

    <text x="40" y="432" class="t b">Bonjour names</text>
    <text x="40" y="462" class="t s" opacity="0.75">needs NSBonjourServices + permission</text>
    <use href="#check" x="573" y="415" width="44" height="44"/>
    <use href="#check" x="698" y="415" width="44" height="44"/>

    <rect x="24" y="480" width="752" height="78" rx="14" fill="#fff"/>
    <text x="40" y="514" class="t b">NetBIOS names</text>
    <text x="40" y="544" class="t s" opacity="0.75">one datagram per host</text>
    <use href="#check" x="573" y="497" width="44" height="44"/>
    <use href="#check" x="698" y="497" width="44" height="44"/>

    <text x="40" y="596" class="t b">SSDP / UPnP names</text>
    <text x="40" y="626" class="t s" opacity="0.75">needs Apple’s multicast entitlement</text>
    <use href="#check" x="573" y="579" width="44" height="44"/>
    <use href="#off" x="698" y="579" width="44" height="44"/>

    <!-- the Mac-only band -->
    <rect x="24" y="644" width="752" height="78" rx="14" fill="#fff"/>
    <text x="40" y="678" class="t b">ARP sweep · SYN · fingerprint</text>
    <text x="40" y="708" class="t s" opacity="0.75">no BPF in the iOS SDK</text>
    <use href="#check" x="573" y="661" width="44" height="44"/>
    <use href="#cross" x="698" y="661" width="44" height="44"/>

    <text x="40" y="760" class="t b">MACs and vendor names</text>
    <text x="40" y="790" class="t s" opacity="0.75">no &lt;net/route.h&gt;; ARP cache hidden</text>
    <use href="#check" x="573" y="743" width="44" height="44"/>
    <use href="#cross" x="698" y="743" width="44" height="44"/>

    <rect x="24" y="808" width="752" height="78" rx="14" fill="#fff"/>
    <text x="40" y="842" class="t b">Default route</text>
    <text x="40" y="872" class="t s" opacity="0.75">iPhone ranks interfaces by name</text>
    <use href="#check" x="573" y="825" width="44" height="44"/>
    <use href="#cross" x="698" y="825" width="44" height="44"/>

    <text x="40" y="924" class="t b">Own MAC address</text>
    <text x="40" y="954" class="m" opacity="0.75">02:00:00:00:00:00</text>
    <use href="#check" x="573" y="907" width="44" height="44"/>
    <use href="#cross" x="698" y="907" width="44" height="44"/>

    <rect x="24" y="972" width="752" height="78" rx="14" fill="#fff"/>
    <text x="40" y="1006" class="t b">Privileged helper</text>
    <text x="40" y="1036" class="t s" opacity="0.75">no launch daemons on iOS</text>
    <use href="#check" x="573" y="989" width="44" height="44"/>
    <use href="#cross" x="698" y="989" width="44" height="44"/>

    <text x="40" y="1088" class="t b">Scan in the background</text>
    <text x="40" y="1118" class="t s" opacity="0.75">iOS suspends the app</text>
    <use href="#check" x="573" y="1071" width="44" height="44"/>
    <use href="#cross" x="698" y="1071" width="44" height="44"/>
  </g>

  <!-- divider between "same" and "Mac only" -->
  <path d="M40 638 H760" stroke="#A79FD0" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- legend -->
  <use href="#check" x="60" y="1146" width="36" height="36"/><text x="104" y="1172" class="t s">works</text>
  <use href="#off" x="240" y="1146" width="36" height="36"/><text x="284" y="1172" class="t s">built, off</text>
  <use href="#cross" x="460" y="1146" width="36" height="36"/><text x="504" y="1172" class="t s">not built</text>
</svg>
