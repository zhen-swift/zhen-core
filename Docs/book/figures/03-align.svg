<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <rect x="4" y="4" width="792" height="552" rx="28" fill="#FFF8EE" stroke="#EADFCC" stroke-width="4"/>

  <text x="40" y="54" class="t b">The kernel packs records end to end</text>

  <!-- the packed buffer -->
  <g stroke="#33335C" stroke-width="3">
    <rect x="40" y="110" width="190" height="58" fill="#FFD45E"/>
    <rect x="230" y="110" width="310" height="58" fill="#FFB38A"/>
    <rect x="540" y="110" width="220" height="58" fill="#BDEBD6"/>
  </g>
  <text x="385" y="148" class="m mid">sockaddr_dl</text>
  <!-- says vs really -->
  <path d="M230 98 V86 H410 V98" fill="none" stroke="#33335C" stroke-width="2.5"/>
  <text x="320" y="80" class="t s mid">“I’m 20 bytes”</text>
  <path d="M230 180 V192 H540 V180" fill="none" stroke="#33335C" stroke-width="2.5"/>
  <text x="385" y="218" class="t s mid">really longer (ch. 8, 12)</text>

  <!-- left: cast -->
  <rect x="24" y="246" width="368" height="288" rx="20" fill="#fff" stroke="#33335C" stroke-width="3"/>
  <use href="#cross" x="44" y="264" width="44" height="44"/>
  <text x="100" y="296" class="t b">cast the struct</text>
  <g stroke="#33335C" stroke-width="2.5">
    <rect x="54" y="350" width="308" height="50" fill="#D9D3EC"/>
    <path d="M98 350 v50 M142 350 v50 M186 350 v50 M230 350 v50 M274 350 v50 M318 350 v50" opacity="0.5"/>
  </g>
  <rect x="120" y="334" width="176" height="82" rx="6" fill="none" stroke="#F26B6B" stroke-width="5" stroke-dasharray="10 7"/>
  <path d="M300 330 l10 -16 l6 12 l12 -18" fill="none" stroke="#F26B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="208" y="454" class="t s mid">lands on a crooked spot:</text>
  <text x="208" y="486" class="t s mid">may crash on</text>
  <text x="208" y="514" class="t s mid">someone else’s Mac</text>

  <!-- right: offset -->
  <rect x="408" y="246" width="368" height="288" rx="20" fill="#fff" stroke="#33335C" stroke-width="3"/>
  <use href="#check" x="428" y="264" width="44" height="44"/>
  <text x="484" y="296" class="t b">read by offset</text>
  <g stroke="#33335C" stroke-width="2.5">
    <rect x="438" y="350" width="306" height="50" fill="#D9D3EC"/>
    <rect x="574" y="350" width="136" height="50" fill="#BDEBD6"/>
    <path d="M472 350 v50 M506 350 v50 M540 350 v50 M608 350 v50 M642 350 v50 M676 350 v50" opacity="0.5"/>
  </g>
  <path d="M438 340 V328 H574 V340" fill="none" stroke="#33335C" stroke-width="2.5"/>
  <text x="506" y="320" class="t s mid">offset 4</text>
  <text x="642" y="320" class="t s mid">4 bytes</text>
  <text x="592" y="454" class="m mid">loadUnaligned(</text>
  <text x="592" y="484" class="m mid">fromByteOffset: 4,</text>
  <text x="592" y="514" class="m mid">as: UInt32.self)</text>
</svg>
