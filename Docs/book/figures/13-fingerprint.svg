<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620">
  <rect x="4" y="4" width="792" height="612" rx="28" fill="#FFF8EE" stroke="#EADFCC" stroke-width="4"/>
  <text x="400" y="54" class="t b mid">Which stack are you? Ask once, nicely.</text>

  <!-- left: 16 odd probes -->
  <rect x="40" y="80" width="340" height="230" rx="20" fill="#fff" stroke="#F26B6B" stroke-width="4"/>
  <text x="210" y="118" class="t b mid">16 odd probes</text>
  <use href="#device" x="140" y="140" width="110" height="96"/>
  <path d="M150 150 l-14 -14 M246 150 l14 -14" stroke="#F26B6B" stroke-width="4" stroke-linecap="round"/>
  <use href="#cross" x="262" y="176" width="50" height="50"/>
  <text x="210" y="272" class="t s mid">may reboot a doorbell</text>

  <!-- right: one SYN -->
  <rect x="420" y="80" width="340" height="230" rx="20" fill="#fff" stroke="#5DBE85" stroke-width="4"/>
  <text x="590" y="118" class="t b mid">Zhen: 1 SYN</text>
  <use href="#pip" x="450" y="140" width="90" height="90"/>
  <path d="M546 186 H618" stroke="#33335C" stroke-width="3" marker-end="url(#arrow)"/>
  <use href="#device" x="626" y="140" width="110" height="96"/>
  <text x="590" y="262" class="t s mid">to a port already open,</text>
  <text x="590" y="290" class="t s mid">offering every option</text>

  <!-- table -->
  <text x="40" y="354" class="t b">The answer’s option order</text>
  <g>
    <rect x="40" y="372" width="720" height="44" rx="10" fill="#fff"/>
    <rect x="40" y="460" width="720" height="44" rx="10" fill="#fff"/>
  </g>
  <g class="m">
    <text x="60" y="402">2-4-8-1-3</text>
    <text x="60" y="446">2-1-3-1-1-8-4</text>
    <text x="60" y="490">2-1-3-1-1-4</text>
    <text x="60" y="534">no WS/SACK/TS</text>
  </g>
  <g class="t s">
    <text x="330" y="402">→ Linux</text>
    <text x="330" y="446">→ macOS or iOS</text>
    <text x="330" y="490">→ Windows (TTL 128)</text>
    <text x="330" y="534">→ embedded (TTL 64)</text>
  </g>
  <text x="400" y="590" class="t s mid" opacity="0.85">No match? It says “unmatched” and shows what it saw.</text>
</svg>
