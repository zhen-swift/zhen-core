<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470">
  <rect x="4" y="4" width="792" height="462" rx="28" fill="#FFF8EE" stroke="#EADFCC" stroke-width="4"/>

  <!-- left panel: polite close -->
  <rect x="24" y="24" width="368" height="422" rx="20" fill="#fff" stroke="#33335C" stroke-width="3"/>
  <text x="208" y="66" class="t b mid">a polite close</text>
  <text x="208" y="100" class="m mid">close(fd)</text>

  <g>
    <rect x="56" y="124" width="140" height="40" rx="10" fill="#D9D3EC" stroke="#33335C" stroke-width="2.5"/>
    <text x="126" y="151" class="m mid">:49152</text>
    <rect x="56" y="172" width="140" height="40" rx="10" fill="#D9D3EC" stroke="#33335C" stroke-width="2.5"/>
    <text x="126" y="199" class="m mid">:49153</text>
    <rect x="56" y="220" width="140" height="40" rx="10" fill="#D9D3EC" stroke="#33335C" stroke-width="2.5"/>
    <text x="126" y="247" class="m mid">:49154</text>
    <text x="126" y="290" class="t b mid">⋮</text>
  </g>
  <text x="290" y="158" class="t s mid">stuck in</text>
  <text x="290" y="190" class="m mid">TIME_WAIT</text>
  <circle cx="290" cy="240" r="28" fill="#fff" stroke="#33335C" stroke-width="3"/>
  <path d="M290 240 V222 M290 240 L302 248" stroke="#33335C" stroke-width="3" stroke-linecap="round"/>

  <use href="#pip-worried" x="72" y="306" width="96" height="96"/>
  <text x="290" y="356" class="t s mid">thousands</text>
  <text x="290" y="386" class="t s mid">of ports, waiting</text>
  <text x="208" y="430" class="t s mid" font-weight="700">ports run out</text>

  <!-- right panel: Zhen's close -->
  <rect x="408" y="24" width="368" height="422" rx="20" fill="#fff" stroke="#33335C" stroke-width="3"/>
  <text x="592" y="66" class="t b mid">Zhen’s close</text>
  <text x="592" y="100" class="m mid">SO_LINGER {1, 0}</text>

  <rect x="440" y="124" width="140" height="40" rx="10" fill="#BDEBD6" stroke="#33335C" stroke-width="2.5"/>
  <text x="510" y="151" class="m mid">:49152</text>
  <path d="M590 144 H660" stroke="#33335C" stroke-width="3.5" marker-end="url(#arrow)"/>
  <path d="M700 122 l7 15 l16 -5 l-8 13 l14 10 l-17 2 l2 16 l-14 -11 l-13 11 l2 -16 l-17 -2 l14 -10 l-8 -13 l16 5 Z" fill="#F26B6B" stroke="#33335C" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="592" y="214" class="t s mid">close sends a RST</text>
  <text x="592" y="246" class="t s mid">the port is free at once</text>

  <use href="#pip-yay" x="544" y="276" width="96" height="96"/>
  <use href="#sparkle" x="652" y="282" width="24" height="24"/>
  <use href="#sparkle" x="522" y="300" width="18" height="18"/>
  <text x="592" y="430" class="t s mid" font-weight="700">reuse right away</text>
</svg>
