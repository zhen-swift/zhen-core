<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540">
  <rect x="4" y="4" width="792" height="532" rx="28" fill="#FFF8EE" stroke="#EADFCC" stroke-width="4"/>

  <!-- panel 1 -->
  <text x="40" y="54" class="t b">One wait for everyone</text>
  <use href="#device" x="40" y="80" width="62" height="54"/>
  <text x="112" y="114" class="t s">0.4 ms</text>
  <use href="#phone" x="56" y="156" width="34" height="58"/>
  <text x="112" y="194" class="t s">180 ms</text>
  <path d="M200 108 H740 M200 186 H740" stroke="#D9D3EC" stroke-width="6" stroke-linecap="round"/>
  <use href="#check" x="206" y="90" width="34" height="34"/>
  <path d="M300 70 V230" stroke="#F26B6B" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="310" y="232" class="t s">give up</text>
  <circle cx="640" cy="186" r="10" fill="#33335C"/>
  <use href="#cross" x="660" y="168" width="34" height="34"/>
  <text x="560" y="150" class="t s">reply, too late</text>

  <path d="M40 262 H760" stroke="#EADFCC" stroke-width="4" stroke-linecap="round"/>

  <!-- panel 2 -->
  <text x="40" y="306" class="t b">A wait for each host</text>
  <use href="#device" x="40" y="332" width="62" height="54"/>
  <text x="112" y="366" class="t s">0.4 ms</text>
  <use href="#phone" x="56" y="408" width="34" height="58"/>
  <text x="112" y="446" class="t s">180 ms</text>
  <path d="M200 360 H740 M200 438 H740" stroke="#D9D3EC" stroke-width="6" stroke-linecap="round"/>
  <use href="#check" x="206" y="342" width="34" height="34"/>
  <path d="M300 334 V384" stroke="#5DBE85" stroke-width="4" stroke-dasharray="10 8"/>
  <circle cx="640" cy="438" r="10" fill="#33335C"/>
  <use href="#check" x="660" y="420" width="34" height="34"/>
  <path d="M720 412 V464" stroke="#5DBE85" stroke-width="4" stroke-dasharray="10 8"/>
  <use href="#pip-yay" x="440" y="272" width="58" height="58"/>

  <text x="400" y="510" class="t s mid">The slow phone was missed on <tspan font-weight="700">every</tspan> run, until each host got its own clock.</text>
</svg>
