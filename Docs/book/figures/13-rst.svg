<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <rect x="4" y="4" width="792" height="512" rx="28" fill="#FFF8EE" stroke="#EADFCC" stroke-width="4"/>
  <text x="400" y="54" class="t b mid">Our own kernel says “RST” for us</text>

  <!-- the Mac with castle -->
  <use href="#castle" x="40" y="90" width="230" height="196"/>
  <text x="155" y="316" class="t s mid">our Mac’s kernel</text>
  <use href="#device" x="610" y="140" width="150" height="130"/>
  <text x="685" y="300" class="t s mid">the target</text>

  <path d="M590 160 H300" stroke="#5DBE85" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="445" y="146" class="m mid">SYN-ACK → :51234</text>
  <path d="M300 236 H590" stroke="#F26B6B" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="445" y="272" class="m mid">RST</text>

  <rect x="100" y="352" width="600" height="60" rx="18" fill="#fff" stroke="#33335C" stroke-width="3"/>
  <text x="400" y="391" class="t s mid">“No socket on port 51234? Not mine. RST.”</text>

  <use href="#pip-yay" x="40" y="420" width="80" height="80"/>
  <text x="134" y="458" class="t s">Good: that keeps it half-open.</text>
  <text x="134" y="490" class="t s" opacity="0.8">Binding a socket would finish the handshake.</text>
</svg>
