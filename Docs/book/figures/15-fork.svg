<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect x="4" y="4" width="792" height="792" rx="28" fill="#FFF8EE" stroke="#EADFCC" stroke-width="4"/>

  <!-- the quote -->
  <rect x="40" y="28" width="720" height="92" rx="20" fill="#FFD45E" stroke="#33335C" stroke-width="3"/>
  <text x="400" y="66" class="t s mid">“Which engines exist is decided by attempting,</text>
  <text x="400" y="100" class="t s mid">never by asking who we are.”</text>

  <!-- the road -->
  <path d="M400 780 V500 L210 330 M400 500 L590 330" fill="none" stroke="#D9D3EC" stroke-width="70" stroke-linejoin="round"/>
  <path d="M400 770 V500 L220 340 M400 500 L580 340" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="16 14"/>

  <!-- shared stones -->
  <g>
    <circle cx="400" cy="720" r="22" fill="#FFB38A" stroke="#33335C" stroke-width="3"/>
    <text x="400" y="728" class="t b mid">1</text>
    <text x="446" y="714" class="t s">raise the ticket limit</text>
    <text x="446" y="742" class="m" opacity="0.75">getrlimit · setrlimit</text>

    <circle cx="400" cy="640" r="22" fill="#FFB38A" stroke="#33335C" stroke-width="3"/>
    <text x="400" y="648" class="t b mid">2</text>
    <text x="446" y="648" class="t s">size the budget</text>

    <circle cx="400" cy="560" r="22" fill="#FFB38A" stroke="#33335C" stroke-width="3"/>
    <text x="400" y="568" class="t b mid">3</text>
    <text x="446" y="554" class="t s">find the interface</text>
    <text x="446" y="582" class="m" opacity="0.75">getifaddrs</text>
  </g>
  <text x="250" y="760" class="t s mid" opacity="0.75">every platform</text>
  <use href="#pip" x="210" y="600" width="120" height="120"/>

  <!-- signpost -->
  <rect x="394" y="400" width="12" height="90" fill="#C98A5E" stroke="#33335C" stroke-width="3"/>
  <path d="M398 404 H250 l-22 22 l22 22 H398 Z" fill="#C98A5E" stroke="#33335C" stroke-width="3" stroke-linejoin="round"/>
  <text x="318" y="436" class="m mid" style="fill:#fff">os(macOS)</text>
  <path d="M402 404 H550 l22 22 l-22 22 H402 Z" fill="#C98A5E" stroke="#33335C" stroke-width="3" stroke-linejoin="round"/>
  <text x="484" y="436" class="m mid" style="fill:#fff">#else</text>

  <!-- Mac destination -->
  <rect x="28" y="140" width="360" height="200" rx="20" fill="#fff" stroke="#33335C" stroke-width="3"/>
  <use href="#periscope" x="40" y="170" width="70" height="120"/>
  <text x="120" y="178" class="t b">Mac</text>
  <text x="120" y="214" class="t s">try to open /dev/bpf</text>
  <text x="120" y="250" class="t s">opened? ARP + ICMP</text>
  <text x="120" y="280" class="t s">and SYN for ports</text>
  <text x="120" y="316" class="t s" opacity="0.75">refused? ICMP only</text>

  <!-- iPhone destination -->
  <rect x="412" y="140" width="360" height="200" rx="20" fill="#fff" stroke="#33335C" stroke-width="3"/>
  <use href="#phone" x="424" y="176" width="64" height="110"/>
  <text x="504" y="178" class="t b">iPhone, iPad</text>
  <text x="504" y="214" class="t s">ICMP sweep</text>
  <text x="504" y="246" class="t s">connect + banners</text>
  <text x="504" y="278" class="t s">names, SSDP off</text>
  <text x="504" y="314" class="t s" opacity="0.75">ask for SYN? throws</text>
</svg>
