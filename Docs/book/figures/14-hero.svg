<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <rect x="4" y="4" width="792" height="472" rx="28" fill="#FFF8EE" stroke="#EADFCC" stroke-width="4"/>
  <path d="M30 400 H770" stroke="#EADFCC" stroke-width="6" stroke-linecap="round"/>

  <!-- the tiny tower: the helper -->
  <rect x="540" y="170" width="150" height="228" fill="#D9D3EC" stroke="#33335C" stroke-width="4"/>
  <path d="M540 170 v-20 h22 v20 h20 v-20 h22 v20 h20 v-20 h22 v20 h22 v-20 h22 v20" fill="#D9D3EC" stroke="#33335C" stroke-width="4" stroke-linejoin="round"/>
  <use href="#crown" x="578" y="82" width="74" height="54"/>
  <rect x="570" y="216" width="90" height="70" rx="10" fill="#33335C"/>
  <use href="#pip" x="580" y="218" width="70" height="70"/>
  <use href="#door" x="586" y="320" width="58" height="80"/>
  <text x="615" y="440" class="t b mid">zhen-helper</text>
  <text x="615" y="468" class="t s mid">root, but tiny</text>

  <!-- the app -->
  <use href="#laptop" x="40" y="220" width="250" height="164"/>
  <use href="#pip" x="122" y="236" width="86" height="86"/>
  <text x="165" y="440" class="t b mid">the app</text>
  <text x="165" y="468" class="t s mid">not root</text>

  <!-- the ticket coming over -->
  <path d="M560 252 C 470 200, 390 200, 300 250" fill="none" stroke="#33335C" stroke-width="3.5" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
  <g transform="rotate(-8 420 180)">
    <use href="#ticket" x="356" y="146" width="130" height="75"/>
    <text x="440" y="196" class="t mid" style="font-size:40px;font-weight:800">7</text>
  </g>
  <use href="#sparkle" x="496" y="140" width="22" height="22"/>
  <text x="420" y="66" class="t b mid">One open(), then hand over the ticket.</text>
