<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" height="580">
  <rect x="4" y="4" width="792" height="572" rx="28" fill="#FFF8EE" stroke="#EADFCC" stroke-width="4"/>

  <text x="400" y="52" class="t b mid">A UDP port can answer four ways</text>

  <!-- open -->
  <rect x="24" y="76" width="368" height="236" rx="20" fill="#fff" stroke="#33335C" stroke-width="3"/>
  <use href="#check" x="44" y="94" width="36" height="36"/>
  <text x="90" y="122" class="t b">open</text>
  <use href="#device" x="56" y="162" width="96" height="84"/>
  <path d="M158 204 H226" stroke="#33335C" stroke-width="3.5" marker-end="url(#arrow)"/>
  <use href="#pip-yay" x="236" y="150" width="100" height="100"/>
  <text x="208" y="290" class="t s mid">a datagram came back</text>

  <!-- closed -->
  <rect x="408" y="76" width="368" height="236" rx="20" fill="#fff" stroke="#33335C" stroke-width="3"/>
  <use href="#cross" x="428" y="94" width="36" height="36"/>
  <text x="474" y="122" class="t b">closed</text>
  <g transform="rotate(-4 592 200)">
    <rect x="452" y="150" width="280" height="96" rx="8" fill="#F26B6B" stroke="#33335C" stroke-width="3"/>
    <rect x="690" y="160" width="30" height="34" fill="#FFD45E" stroke="#33335C" stroke-width="2"/>
    <text x="470" y="186" class="t s" style="fill:#fff" font-weight="700">ICMP</text>
    <text x="470" y="224" class="m" style="fill:#fff">port unreachable</text>
  </g>
  <text x="592" y="290" class="m mid">ECONNREFUSED</text>

  <!-- filtered -->
  <rect x="24" y="328" width="368" height="236" rx="20" fill="#fff" stroke="#33335C" stroke-width="3"/>
  <use href="#off" x="44" y="346" width="36" height="36"/>
  <text x="90" y="374" class="t b">filtered</text>
  <g transform="rotate(3 208 450)">
    <rect x="68" y="402" width="280" height="96" rx="8" fill="#FFD45E" stroke="#33335C" stroke-width="3"/>
    <rect x="306" y="412" width="30" height="34" fill="#B9A3F5" stroke="#33335C" stroke-width="2"/>
    <text x="86" y="438" class="t s" font-weight="700">ICMP</text>
    <text x="86" y="476" class="m">host unreachable</text>
  </g>
  <text x="208" y="542" class="t s mid">some other ICMP error</text>

  <!-- open|filtered -->
  <rect x="408" y="328" width="368" height="236" rx="20" fill="#fff" stroke="#33335C" stroke-width="3"/>
  <circle cx="446" cy="364" r="17" fill="#B9A3F5" stroke="#33335C" stroke-width="3"/>
  <text x="446" y="372" class="t s mid" font-weight="700">?</text>
  <text x="474" y="374" class="t b">open|filtered</text>
  <use href="#pip" x="532" y="400" width="104" height="104"/>
  <rect x="650" y="400" width="84" height="46" rx="18" fill="#fff" stroke="#33335C" stroke-width="3"/>
  <text x="692" y="430" class="t b mid">…</text>
  <text x="592" y="542" class="t s mid">silence: can’t tell</text>
</svg>
