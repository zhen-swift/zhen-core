<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380">
  <rect x="4" y="4" width="792" height="372" rx="28" fill="#FFF8EE" stroke="#EADFCC" stroke-width="4"/>

  <!-- a wall of sticky notes -->
  <g transform="rotate(-5 140 150)">
    <rect x="50" y="60" width="190" height="150" fill="#FFD45E" stroke="#33335C" stroke-width="3"/>
    <text x="145" y="128" class="m mid" style="font-weight:700">EACCES</text>
    <text x="145" y="168" class="t s mid">not allowed</text>
  </g>
  <g transform="rotate(4 360 140)">
    <rect x="270" y="56" width="190" height="150" fill="#BDEBD6" stroke="#33335C" stroke-width="3"/>
    <text x="365" y="124" class="m mid" style="font-weight:700">EAGAIN</text>
    <text x="365" y="164" class="t s mid">try later</text>
  </g>
  <g transform="rotate(-3 590 150)">
    <rect x="490" y="60" width="210" height="150" fill="#FF8FA3" stroke="#33335C" stroke-width="3"/>
    <text x="595" y="128" class="m mid" style="font-weight:700">ECONNREFUSED</text>
    <text x="595" y="168" class="t s mid">port is closed</text>
  </g>
  <use href="#pip" x="80" y="230" width="120" height="120"/>
  <text x="440" y="300" class="t b mid">-1 means no. errno says why.</text>
</svg>
