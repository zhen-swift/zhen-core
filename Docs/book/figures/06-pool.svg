  <!-- into one pool -->
  <path d="M414 160 H462" stroke="#33335C" stroke-width="3.5" marker-end="url(#arrow)"/>
  <path d="M474 96 h170 l-50 56 v40 h-70 v-40 Z" fill="#B9A3F5" stroke="#33335C" stroke-width="3.5" stroke-linejoin="round"/>
  <text x="559" y="130" class="t s mid">one pool</text>
  <text x="559" y="232" class="m mid">min(512, tickets÷4)</text>
  <text x="700" y="158" class="t s mid">at once</text>

  <!-- the payoff -->
  <path d="M40 262 H760" stroke="#EADFCC" stroke-width="4" stroke-linecap="round"/>
  <text x="400" y="304" class="t b mid">A host where every port is filtered costs…</text>

