<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <rect x="4" y="4" width="792" height="512" rx="28" fill="#FFF8EE" stroke="#EADFCC" stroke-width="4"/>

  <text x="40" y="56" class="t b">Three racers, one answer</text>

  <!-- racers -->
  <g transform="translate(40 92)"><path d="M8 50 Q13 45 13 32 Q13 10 34 8 Q55 10 55 32 Q55 45 60 50 Z" fill="#FFD45E" stroke="#33335C" stroke-width="3.5" stroke-linejoin="round"/><circle cx="34" cy="56" r="6" fill="#33335C"/><circle cx="34" cy="6" r="4" fill="#33335C"/></g>
  <text x="122" y="132" class="t s">socket ready</text>
  <g transform="translate(44 202)"><circle cx="30" cy="30" r="26" fill="#fff" stroke="#33335C" stroke-width="3.5"/><path d="M30 14 V30 L42 38" fill="none" stroke="#33335C" stroke-width="3.5" stroke-linecap="round"/></g>
  <text x="122" y="242" class="t s">time is up</text>
  <g transform="translate(44 312)"><path d="M18 2 H42 L58 18 V42 L42 58 H18 L2 42 V18 Z" fill="#F26B6B" stroke="#33335C" stroke-width="3" stroke-linejoin="round"/><rect x="14" y="26" width="32" height="8" rx="3" fill="#fff"/></g>
  <text x="122" y="352" class="t s">task cancelled</text>

  <g fill="none" stroke="#33335C" stroke-width="3" marker-end="url(#arrow)">
    <path d="M276 124 C 330 124, 340 190, 384 210"/>
    <path d="M250 236 H384"/>
    <path d="M290 344 C 330 344, 340 280, 384 262"/>
  </g>

  <!-- the box -->
  <rect x="390" y="160" width="200" height="150" rx="16" fill="#B9A3F5" stroke="#33335C" stroke-width="3.5"/>
  <rect x="440" y="178" width="100" height="12" rx="6" fill="#33335C"/>
  <text x="490" y="240" class="m mid">OutcomeBox</text>
  <text x="490" y="280" class="t s mid">first one wins</text>
  <use href="#lock" x="566" y="134" width="40" height="49"/>

  <path d="M594 236 H644" stroke="#33335C" stroke-width="3.5" marker-end="url(#arrow)"/>
  <use href="#pip-yay" x="650" y="172" width="120" height="120"/>
  <text x="710" y="324" class="t s mid">resumed</text>
  <text x="710" y="352" class="t s mid">exactly once</text>

  <!-- ResumeOnce -->
  <rect x="34" y="400" width="732" height="90" rx="16" fill="#fff" stroke="#33335C" stroke-width="3"/>
  <text x="58" y="438" class="m">ResumeOnce</text>
  <text x="58" y="472" class="t s">remembers a cancel that came before the bells were hung</text>
</svg>
