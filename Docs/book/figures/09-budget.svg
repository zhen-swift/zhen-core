<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <rect x="4" y="4" width="792" height="472" rx="28" fill="#FFF8EE" stroke="#EADFCC" stroke-width="4"/>

  <text x="400" y="52" class="t b mid">The naming stage, on one clock</text>

  <!-- axis -->
  <path d="M200 84 V340" stroke="#A79FD0" stroke-width="3" stroke-dasharray="6 6"/>
  <path d="M578 84 V340" stroke="#A79FD0" stroke-width="3" stroke-dasharray="6 6"/>
  <path d="M740 84 V340" stroke="#A79FD0" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="200" y="370" class="m mid">0</text>
  <text x="578" y="370" class="m mid">70%</text>
  <text x="740" y="370" class="m mid">100%</text>

  <!-- mDNS -->
  <text x="40" y="128" class="t b">Bonjour</text>
  <rect x="200" y="100" width="190" height="40" rx="10" fill="#5DBE85" stroke="#33335C" stroke-width="3"/>
  <rect x="390" y="100" width="188" height="40" rx="10" fill="none" stroke="#33335C" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="296" y="128" class="t s mid" style="fill:#fff">listening</text>
  <text x="484" y="128" class="t s mid" opacity="0.8">quiet? stop</text>

  <!-- SSDP -->
  <text x="40" y="208" class="t b">SSDP</text>
  <rect x="200" y="180" width="227" height="40" rx="10" fill="#6FA8FF" stroke="#33335C" stroke-width="3"/>
  <rect x="427" y="180" width="151" height="40" rx="10" fill="#B9A3F5" stroke="#33335C" stroke-width="3"/>
  <text x="313" y="208" class="t s mid">listen</text>
  <text x="502" y="208" class="t s mid">fetch</text>

  <!-- NetBIOS -->
  <text x="40" y="288" class="t b">NetBIOS</text>
  <rect x="578" y="260" width="162" height="40" rx="10" fill="#FFD45E" stroke="#33335C" stroke-width="3"/>
  <text x="659" y="288" class="t s mid">unnamed</text>
  <text x="560" y="288" class="t s" style="text-anchor:end" opacity="0.8">then, only the</text>

  <!-- notes -->
  <use href="#pip-yay" x="40" y="388" width="72" height="72"/>
  <text x="128" y="414" class="t s">Stage = 40% of what’s left, 1.5 s to 4.5 s.</text>
  <text x="128" y="446" class="t s">Bonjour stops after 0.7 s with nothing new.</text>
</svg>
