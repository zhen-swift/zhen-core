<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect x="4" y="4" width="792" height="492" rx="28" fill="#FFF8EE" stroke="#EADFCC" stroke-width="4"/>

  <text x="400" y="52" class="t b mid">Four networks are “up”. Which one is home?</text>

  <!-- cables -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M236 230 C 360 230, 380 120, 520 120" stroke="#5DBE85" stroke-width="9"/>
    <path d="M236 240 C 380 240, 400 205, 520 205" stroke="#A79FD0"/>
    <path d="M236 250 C 380 250, 400 300, 520 300" stroke="#A79FD0"/>
    <path d="M236 260 C 360 270, 380 395, 520 395" stroke="#A79FD0"/>
  </g>

  <use href="#laptop" x="40" y="168" width="200" height="131"/>
  <use href="#pip-worried" x="84" y="336" width="96" height="96"/>
  <rect x="186" y="350" width="150" height="46" rx="18" fill="#fff" stroke="#33335C" stroke-width="3"/>
  <text x="261" y="381" class="t s mid">which one?</text>

  <!-- the default route sign -->
  <g transform="rotate(-8 400 150)">
    <rect x="316" y="128" width="164" height="40" rx="8" fill="#FFD45E" stroke="#33335C" stroke-width="3"/>
    <text x="398" y="155" class="t s mid" font-weight="700">default route</text>
  </g>

  <!-- the four -->
  <use href="#router" x="536" y="88" width="96" height="62"/>
  <text x="648" y="118" class="m">en0</text>
  <text x="648" y="144" class="t s" opacity="0.75">Wi-Fi</text>
  <use href="#check" x="730" y="96" width="36" height="36"/>

  <rect x="532" y="186" width="104" height="40" rx="20" fill="#B9A3F5" stroke="#33335C" stroke-width="3"/>
  <use href="#lock" x="568" y="190" width="28" height="34"/>
  <text x="648" y="204" class="m">utun3</text>
  <text x="648" y="230" class="t s" opacity="0.75">VPN</text>

  <rect x="532" y="276" width="104" height="52" rx="10" fill="#D9D3EC" stroke="#33335C" stroke-width="3"/>
  <text x="584" y="310" class="t s mid">VM</text>
  <text x="648" y="300" class="m">bridge100</text>
  <text x="648" y="326" class="t s" opacity="0.75">containers</text>

  <use href="#phone" x="560" y="360" width="40" height="70"/>
  <text x="648" y="392" class="m">en7</text>
  <text x="648" y="418" class="t s" opacity="0.75">USB tether</text>

  <text x="400" y="472" class="t s mid">“The first one that’s up” is often the wrong one.</text>
</svg>
