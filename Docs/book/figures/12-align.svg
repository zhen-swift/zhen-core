<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <rect x="4" y="4" width="792" height="552" rx="28" fill="#FFF8EE" stroke="#EADFCC" stroke-width="4"/>
  <text x="400" y="54" class="t b mid">Packed end to end, by the kernel</text>

  <!-- the strip -->
  <g stroke="#33335C" stroke-width="3">
    <rect x="40"  y="80" width="200" height="60" fill="#B9A3F5"/>
    <rect x="240" y="80" width="80"  height="60" fill="#6FA8FF"/>
    <rect x="320" y="80" width="120" height="60" fill="#FFB38A"/>
    <rect x="440" y="80" width="200" height="60" fill="#B9A3F5"/>
    <rect x="640" y="80" width="80"  height="60" fill="#6FA8FF"/>
    <rect x="720" y="80" width="40"  height="60" fill="#FFB38A"/>
  </g>
  <text x="140" y="118" class="m mid">rt_msghdr</text>
  <text x="380" y="118" class="m mid">sdl</text>
  <text x="540" y="118" class="m mid">rt_msghdr</text>
  <text x="400" y="176" class="t s mid">any 4-byte step · lengths vary · no Swift layout</text>

  <!-- left: cast -->
  <rect x="40" y="206" width="350" height="320" rx="20" fill="#fff" stroke="#F26B6B" stroke-width="4"/>
  <text x="215" y="248" class="t b mid">Cast it to a struct</text>
  <text x="215" y="290" class="m mid">bindMemory(to:)</text>
  <use href="#cross" x="185" y="306" width="60" height="60"/>
  <text x="215" y="400" class="t s mid">undefined behaviour:</text>
  <text x="215" y="434" class="t s mid">works on your Mac,</text>
  <text x="215" y="468" class="t s mid">crashes on theirs</text>
  <use href="#pip-worried" x="262" y="302" width="68" height="68"/>

  <!-- right: offsets -->
  <rect x="410" y="206" width="350" height="320" rx="20" fill="#fff" stroke="#5DBE85" stroke-width="4"/>
  <text x="585" y="248" class="t b mid">Read at byte offsets</text>
  <g>
    <rect x="440" y="272" width="64" height="44" rx="10" fill="#BDEBD6" stroke="#33335C" stroke-width="3"/>
    <rect x="514" y="272" width="64" height="44" rx="10" fill="#BDEBD6" stroke="#33335C" stroke-width="3"/>
    <rect x="588" y="272" width="64" height="44" rx="10" fill="#BDEBD6" stroke="#33335C" stroke-width="3"/>
    <rect x="662" y="272" width="80" height="44" rx="10" fill="#BDEBD6" stroke="#33335C" stroke-width="3"/>
  </g>
  <g class="m mid"><text x="472" y="302">u8</text><text x="546" y="302">u16</text><text x="620" y="302">i32</text><text x="702" y="302">u32be</text></g>
  <use href="#check" x="555" y="330" width="60" height="60"/>
  <text x="585" y="424" class="m mid">unsafeLoadUnaligned</text>
  <text x="585" y="458" class="t s mid">over a RawSpan,</text>
  <text x="585" y="490" class="t s mid">bounds-checked</text>
</svg>
